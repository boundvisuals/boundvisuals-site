name: Ingest project from MEGA

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project id (e.g. vivendas-duas-igrejas)"
        required: true
      mega_link:
        description: "Public MEGA link to the PROJECT folder (only *final* subfolders are taken)"
        required: true

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MEGAcmd + Python deps
        run: |
          wget -q https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb -O megacmd.deb
          sudo apt-get update -qq && sudo apt-get install -y -qq ./megacmd.deb
          pip install -q pillow pyyaml numpy
      - name: Download finals only
        env:
          LINK: ${{ inputs.mega_link }}
        run: |
          mkdir -p out
          bash scripts/fetch_finals.sh "$LINK" in 2>&1 | tee out/fetch.log
          cp all.txt out/folder_tree.txt || true
      - name: Process (lossless web + Instagram 4:5)
        run: python scripts/process_media.py in out "${{ inputs.project_id }}" config/program.yml 2>&1 | tee out/process.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_id }}-processed
          path: out
          retention-days: 1
      - name: Save report + Instagram slides + editor previews to repo
        if: always()
        run: |
          D=reports/${{ inputs.project_id }}
          # only replace what this robot owns (ig slides, logs, previews); stories/reels belong to make-social
          rm -rf "$D/ig" "$D/preview"; mkdir -p "$D/ig" "$D/preview"
          cp out/*.log out/folder_tree.txt out/manifest.json "$D/" 2>/dev/null || true
          cp out/ig/*.jpg "$D/ig/" 2>/dev/null || true
          python3 - "$D/preview" <<'PY'
          import pathlib, sys
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          src = pathlib.Path("in"); out = pathlib.Path(sys.argv[1])
          for p in sorted(src.rglob("*")):
              if p.suffix.lower() not in {".png", ".jpg", ".jpeg", ".tif", ".tiff", ".webp"}: continue
              stem = "_".join(p.relative_to(src).with_suffix("").parts).replace(" ", "_")
              im = Image.open(p); im.load(); im = im.convert("RGB"); w, h = im.size
              s = 1400 / max(w, h); im.resize((round(w * s), round(h * s)), Image.LANCZOS).save(out / f"{stem}.jpg", quality=85)
          PY
          git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
          git add -A reports && git commit -qm "Report: ${{ inputs.project_id }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 15 + 5)); done
          exit 1
