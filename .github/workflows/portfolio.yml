name: portfolio
# Rebuilds the portfolio PDF whenever project images or the profile change; uploads it next to the Painel.
on:
  push:
    branches: [main]
    paths: ["reports/*/preview/**", "docs/profile.yml", "projects/registry.yml", "scripts/build_portfolio.py"]
  workflow_dispatch:
concurrency: { group: portfolio, cancel-in-progress: true }
jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp && pip install -q pyyaml playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python scripts/build_portfolio.py out
      - env: { H: "${{ secrets.FTP_HOST }}", U: "${{ secrets.FTP_USER }}", P: "${{ secrets.FTP_PASS }}" }
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > out/portfolio-updated.txt
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; mkdir -p -f /public_html/painel/files; put -O /public_html/painel/files out/Vitor-Hugo-Bound-Visuals-Portfolio.pdf; put -O /public_html/painel/files out/portfolio-updated.txt; bye" "$H"
