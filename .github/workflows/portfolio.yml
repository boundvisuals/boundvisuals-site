name: portfolio
# CV + portfolio PDFs in Vítor's InDesign style, rebuilt whenever projects/images/profile change; uploaded next to the Painel.
on:
  push:
    branches: [main]
    paths: ["reports/*/preview/**", "docs/profile.yml", "docs/cv.yml", "docs/ai-portfolio.yml", "docs/projects-archive.yml", "docs/cv-source/media/**", "projects/registry.yml", "scripts/build_portfolio.py", "config/crops.yml"]
  workflow_dispatch:
concurrency: { group: portfolio, cancel-in-progress: true }
jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: assets, path: assets, sparse-checkout: "brand/fontes" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp && pip install -q pyyaml pillow pypdf playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python scripts/build_portfolio.py out assets
      - env: { H: "${{ secrets.FTP_HOST }}", U: "${{ secrets.FTP_USER }}", P: "${{ secrets.FTP_PASS }}" }
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > out/updated.txt
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; mkdir -p -f /public_html/painel/files; mput -O /public_html/painel/files out/*.pdf out/updated.txt; bye" "$H"
