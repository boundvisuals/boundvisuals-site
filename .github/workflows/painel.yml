name: painel
# Keeps https://www.boundvisuals.com/painel/ up to date (no Claude credits):
# reads approvals/ticks made in the panel → applies approvals to queue/*.yml → rebuilds data + thumbs → uploads.
on:
  push:
    branches: [main]
    paths: ["queue/**", "reports/**", "docs/tasks.yml", "docs/profile.yml", "docs/content-plan.yml", "docs/personal-projects.yml", "docs/inbox-replies.yml", "docs/decisions.yml", "docs/kits/**", "docs/daily-study-briefings.md", "painel/**", "projects/registry.yml", "scripts/build_painel.py"]
  # 4×/day fallback (free Actions minutes); panel actions start it instantly via api.php, publish wakes it after a post.
  schedule: [{ cron: "7 8,13,18,22 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: painel, cancel-in-progress: false }
jobs:
  painel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: { H: "${{ secrets.FTP_HOST }}", U: "${{ secrets.FTP_USER }}", P: "${{ secrets.FTP_PASS }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 20 }
      - run: (timeout 180 sudo apt-get update -qq || true) && timeout 300 sudo apt-get install -y -qq lftp && pip install -q pyyaml pillow
      - name: Read approvals made in the panel
        run: |
          mkdir -p in
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; lcd in; get /public_html/painel/store/approvals.json.php -o approvals.json.php; bye" "$H" 2>/dev/null || true
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; lcd in; get /public_html/painel/store/inbox.json.php -o inbox.json.php; bye" "$H" 2>/dev/null || true
          if [ -f in/inbox.json.php ]; then
            tail -n +2 in/inbox.json.php > docs/inbox.json
            if ! git diff --quiet -- docs/inbox.json 2>/dev/null || [ -n "$(git status --porcelain docs/inbox.json)" ]; then
              git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
              git add docs/inbox.json && git commit -qm "Painel: ideas inbox" || true
              for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
            fi
          fi
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; lcd in; get /public_html/painel/store/deleted.json.php -o deleted.json.php; bye" "$H" 2>/dev/null || true
          [ -f in/deleted.json.php ] && tail -n +2 in/deleted.json.php > docs/deleted.json
          python scripts/dedupe_queue.py || true
          if [ -n "$(git status --porcelain docs/deleted.json queue)" ]; then
            git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
            git add docs/deleted.json queue && git commit -qm "Painel: deletions + no repeats" || true
            for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
          fi
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; lcd in; get /public_html/painel/store/ping.json.php -o ping.json.php; bye" "$H" 2>/dev/null || true
          if [ -f in/ping.json.php ]; then
            tail -n +2 in/ping.json.php > docs/claude-ping.json
            if [ -n "$(git status --porcelain docs/claude-ping.json)" ]; then
              git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
              git add docs/claude-ping.json && git commit -qm "Painel: aviso para o Claude" || true
              for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
            fi
          fi
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; lcd in; get /public_html/painel/store/opps.json.php -o opps.json.php; bye" "$H" 2>/dev/null || true
          if [ -f in/opps.json.php ]; then
            tail -n +2 in/opps.json.php > docs/opps.json
            if [ -n "$(git status --porcelain docs/opps.json)" ]; then
              git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
              git add docs/opps.json && git commit -qm "Painel: opportunities" || true
              for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
            fi
          fi
          if [ -f in/approvals.json.php ]; then
            n=$(python3 scripts/build_painel.py apply in/approvals.json.php)
            echo "applied $n approvals"
            if [ "$n" != "0" ]; then
              git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
              git add queue && git commit -qm "Approved in the panel ($n)"
              for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
              # publish right away whatever is now approved and due
              for t in 1 2 3 4 5; do GH_TOKEN="${{ github.token }}" gh api -X POST "repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches" -f ref=main -f "inputs[mode]=run" && break; sleep 10; done
            fi
          fi
      - name: Apply crop edits made in the panel (then rebuild slides + stories of that project)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; lcd in; get /public_html/painel/store/crops.json.php -o crops.json.php; bye" "$H" 2>/dev/null || true
          [ -f in/crops.json.php ] || exit 0
          python3 scripts/build_painel.py apply-crops in/crops.json.php > in/changed.txt
          [ -s in/changed.txt ] || exit 0
          git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
          git add config/crops.yml config/story_crops.yml 2>/dev/null; git commit -qm "Crops edited in the panel: $(tr '\n' ' ' < in/changed.txt)"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
          while read -r pid; do
            link=$(python3 -c "import yaml,sys;r=yaml.safe_load(open('projects/registry.yml'));r=r.get('projects',r) if isinstance(r,dict) else r;print(next((p.get('mega','') for p in r if p['id']==sys.argv[1]),''))" "$pid")
            title=$(python3 -c "import yaml,sys;r=yaml.safe_load(open('projects/registry.yml'));r=r.get('projects',r) if isinstance(r,dict) else r;print(next((p.get('title','') for p in r if p['id']==sys.argv[1]),''))" "$pid")
            [ -n "$link" ] || continue
            for w in ingest make-social; do
              for t in 1 2 3 4 5; do
                if [ $w = ingest ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/ingest.yml/dispatches" -f ref=main -f "inputs[project_id]=$pid" -f "inputs[mega_link]=$link" && break
                else gh api -X POST "repos/${{ github.repository }}/actions/workflows/make-social.yml/dispatches" -f ref=main -f "inputs[project_id]=$pid" -f "inputs[title]=$title" -f "inputs[mega_link]=$link" && break; fi
                sleep 10
              done
            done
            echo "rebuild dispatched for $pid"
          done < in/changed.txt
      - name: Apply caption edits made in the panel
        run: |
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; lcd in; get /public_html/painel/store/captions.json.php -o captions.json.php; bye" "$H" 2>/dev/null || true
          [ -f in/captions.json.php ] || exit 0
          n=$(python3 scripts/build_painel.py apply-captions in/captions.json.php)
          if [ "$n" != "0" ]; then
            git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
            git add queue && git commit -qm "Captions edited in the panel ($n)"
            for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
          fi
      - name: Queue follows regenerated slides
        run: |
          r=$(python3 scripts/build_painel.py sync-reels)
          n=$(python3 scripts/build_painel.py sync-slides)
          [ "$r" != "0" ] && n="$n+$r reels"
          t=$(python3 scripts/make_teasers.py || echo 0)
          [ "$t" != "0" ] && n="$n+$t teasers"
          if [ "$n" != "0" ]; then
            git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
            git add queue; git add reports/*/story/teaser-*.jpg 2>/dev/null || true; git commit -qm "Queue slides synced ($n)"
            for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
          fi
      - name: Build panel
        run: |
          mkdir -p out
          cp painel/app.html painel/api.php painel/push.php painel/ligar.php painel/index.php painel/config.php painel/manifest.webmanifest painel/sw.js painel/icon.svg painel/icon-192.png painel/icon-512.png out/
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          python3 scripts/build_painel.py build out
          python3 scripts/notify.py out/store/notify.json.php || printf '<?php exit; ?>\n[]' > out/store/notify.json.php
      - name: Upload
        run: |
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; mkdir -p -f /public_html/painel/store; mirror -R --ignore-time out/thumbs /public_html/painel/thumbs; put -O /public_html/painel/store out/store/data.json.php; put -O /public_html/painel/store out/store/notify.json.php; mput -O /public_html/painel out/app.html out/api.php out/push.php out/ligar.php out/index.php out/config.php out/manifest.webmanifest out/sw.js out/icon.svg out/icon-192.png out/icon-512.png out/robots.txt; bye" "$H"
      - name: Send due reminders (Web Push; each id once)
        run: curl -sS --max-time 40 "https://www.boundvisuals.com/painel/push.php?a=run" || true
