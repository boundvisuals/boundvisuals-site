name: publish
# Every 30 min: upload queued images to the server, then publish approved posts that are due.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode: { description: "run | check (check = private test, publishes nothing)", default: run }
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp && pip install -q pyyaml
      - name: Upload queued images to /bv-fila
        env: { H: "${{ secrets.FTP_HOST }}", U: "${{ secrets.FTP_USER }}", P: "${{ secrets.FTP_PASS }}" }
        run: |
          python3 - <<'PY'
          import yaml, glob, os, shutil
          os.makedirs("fila", exist_ok=True)
          open("fila/.htaccess","w").write("Options -Indexes\n<IfModule mod_headers.c>\nHeader set X-Robots-Tag \"noindex, nofollow\"\n</IfModule>\n")
          for f in glob.glob("queue/week-*.yml"):
              for it in yaml.safe_load(open(f)) or []:
                  d = f"fila/{it['project']}"; os.makedirs(d, exist_ok=True)
                  for s in it["slides"]:
                      if os.path.exists(f"reports/{it['project']}/ig/{s}"): shutil.copy(f"reports/{it['project']}/ig/{s}", d)
          for f in glob.glob("queue/social-week-*.yml"):
              for it in yaml.safe_load(open(f)) or []:
                  d = f"fila/{it['project']}/{it['type']}"; os.makedirs(d, exist_ok=True)
                  if os.path.exists(f"reports/{it['project']}/{it['type']}/{it['file']}"): shutil.copy(f"reports/{it['project']}/{it['type']}/{it['file']}", d)
                  if it.get("cover") and os.path.exists(f"reports/{it['project']}/{it['type']}/{it['cover']}"):
                      shutil.copy(f"reports/{it['project']}/{it['type']}/{it['cover']}", d)
          PY
          lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; mirror -R --ignore-time fila /public_html/bv-fila; bye" "$H"
          # approved feed posts: always overwrite their slides (never let an old crop survive on the server)
          python3 - > put.lftp <<'PY'
          import yaml, glob, os
          for f in glob.glob("queue/week-*.yml"):
              for it in yaml.safe_load(open(f)) or []:
                  if not it.get("approved"): continue
                  fs = [f"reports/{it['project']}/ig/{s}" for s in it["slides"] if os.path.exists(f"reports/{it['project']}/ig/{s}")]
                  if fs: print(f"mput -O /public_html/bv-fila/{it['project']} " + " ".join('"' + x + '"' for x in fs))
          PY
          [ -s put.lftp ] && lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; source put.lftp; bye" "$H" || true
      - name: Publish
        env: { META_TOKEN: "${{ secrets.META_TOKEN }}" }
        run: python3 scripts/publish.py "${{ inputs.mode || 'run' }}"
      - if: always()
        run: |
          git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
          git add queue/published.json reports/publish 2>/dev/null
          git commit -qm "Publish log" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          echo "LOG PUSH FAILED"; exit 1
