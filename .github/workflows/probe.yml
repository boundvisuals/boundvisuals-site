name: Probe server ports
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p reports
          for h in picard.servidorpt.pt; do echo "== $h ($(getent hosts $h | cut -d" " -f1))"; for p in 44222 11234 27217 5959; do
            if timeout 5 bash -c "echo > /dev/tcp/$h/$p" 2>/dev/null; then
              b=$(timeout 4 bash -c "exec 3<>/dev/tcp/$h/$p; head -c 80 <&3" 2>/dev/null | tr -d '\r\n')
              echo "$p OPEN $b"
            else echo "$p closed"; fi
          done; done | tee reports/probe.txt
          git config user.name bv-robot; git config user.email robot@boundvisuals.com
          git add reports/probe.txt && git commit -qm "Probe report" && git pull --rebase -q && git push -q || true
