name: Preview finals (for hand crops)
# Saves 1400px JPEG previews of every final to reports/<project>/preview/<stem>.jpg so crops can be composed by eye.
# stem = same naming as process_media / make_social (path parts joined by _, spaces -> _).
on:
  workflow_dispatch:
    inputs:
      project_id: { description: "Project id", required: true }
      mega_link: { description: "Public MEGA link to the PROJECT folder", required: true }
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MEGAcmd + Pillow
        run: |
          wget -q https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb -O megacmd.deb
          sudo apt-get update -qq && sudo apt-get install -y -qq ./megacmd.deb
          pip install -q pillow
      - name: Download finals
        env: { LINK: "${{ inputs.mega_link }}" }
        run: bash scripts/fetch_finals.sh "$LINK" in 2>&1 | tail -5
      - name: Make previews
        run: |
          python - <<'PY'
          import pathlib
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=None
          src=pathlib.Path("in"); out=pathlib.Path("reports/${{ inputs.project_id }}/preview"); out.mkdir(parents=True,exist_ok=True)
          for p in sorted(src.rglob("*")):
              if p.suffix.lower() not in {".png",".jpg",".jpeg",".tif",".tiff",".webp"}: continue
              stem="_".join(p.relative_to(src).with_suffix("").parts).replace(" ","_")
              im=Image.open(p); im.load(); im=im.convert("RGB"); w,h=im.size
              s=1400/max(w,h); im=im.resize((round(w*s),round(h*s)),Image.LANCZOS)
              im.save(out/f"{stem}.jpg",quality=85); print(stem,w,h)
          PY
      - name: Save to repo
        if: always()
        run: |
          git config user.name "bv-robot"; git config user.email "robot@boundvisuals.com"
          git add reports && git commit -qm "Previews: ${{ inputs.project_id }}"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q && git push && exit 0
            sleep $((RANDOM % 20 + 10))
          done
          exit 1
