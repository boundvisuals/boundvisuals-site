  caption_en: Grey sky, white volumes and an ordinary street that feels lived in. Vivendas Cête, Penafiel.
  caption_pt: Céu cinzento, volumes brancos e uma rua comum que parece vivida. Vivendas Cête, Penafiel.
  approved: false
  caption_li: 'Not every image needs a blue sky.

    Grey light flattens nothing here: it makes the white volumes honest and the street feel lived in.

    I often prefer the overcast version. It ages better and clients trust it more.

    Vivendas Cête, Penafiel.'
