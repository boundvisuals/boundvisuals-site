  caption_li: 'The street view is the one neighbours will actually see.

    I set it at dusk with the neighbourhood moving past, because a row of houses only makes sense as part of a street.

    People and passing life were added last and carefully: enough to feel real, never enough to distract.

    Duas Igrejas, Penafiel.'
