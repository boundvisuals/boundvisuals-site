  caption_en: Warm light, a timber wardrobe and a bed made for slow mornings. Duas Igrejas, Penafiel.
  caption_pt: Luz quente, um roupeiro em madeira e uma cama feita para manhãs lentas. Duas Igrejas, Penafiel.
