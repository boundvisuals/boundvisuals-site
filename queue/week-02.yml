  caption_en: First light through the curtains. A bedroom designed to slow the morning down. Gold Village.
  caption_pt: A primeira luz pelas cortinas. Um quarto pensado para abrandar a manhã. Gold Village.
  approved: true
  caption_li: 'Bedrooms are the easiest rooms to over-light.

    I went the other way: first light through the curtains, soft shadows, almost no contrast.

    The goal was a room that slows the morning down, and the lighting had to do that job alone.

    Gold Village.'
