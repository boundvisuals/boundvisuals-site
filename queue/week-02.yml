- date: '2026-11-15'
  time: '19:00'
  project: school-building
  slides:
  - Renders_finais_3-exterior5-01.jpg
  caption_en: Rain on the playground, timber eaves and children under the canopy. School Building, Switzerland.
  caption_pt: Chuva no recreio, beirados em madeira e crianças debaixo da pala. School Building, Suíça.
  approved: true
  caption_li: 'Most school renders show sunshine. I wanted rain.

    Wet ground, timber eaves and children sheltering under the canopy show what the architecture is actually for.

    Bad weather is one of the most honest ways to present a building.

    School Building, Switzerland.'
