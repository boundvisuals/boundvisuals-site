  caption_en: A new school in a Swiss town, seen from above on a misty autumn morning. School Building, Switzerland.
  caption_pt: Uma escola nova numa cidade suíça, vista de cima numa manhã de outono com nevoeiro. School Building, Suíça.
  approved: true
  caption_li: 'I chose to open this project from the air, on a misty autumn morning.

    A school is part of a town before it is a building, and the aerial shows that relationship first.

    The mist was a deliberate choice: it calms the context and lets the roofs and courtyards read clearly.

    School Building, Switzerland.'
