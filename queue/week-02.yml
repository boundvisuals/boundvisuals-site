  caption_en: Dark cladding, planted balconies and a quiet path to the door. Apartamentos Gondomar 2.
  caption_pt: Revestimento escuro, varandas com plantas e um caminho calmo até à porta. Apartamentos Gondomar 2.
  approved: true
  caption_li: 'Dark facades are hard to light. Go too far and you lose all the detail.

    Here I let the planted balconies and the path to the door carry the brightness instead.

    The result is a building that feels calm, not heavy.

    Apartamentos Gondomar 2.'
