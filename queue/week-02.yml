  caption_en: Six floors, one calm facade. Rhythm, shade and a meadow in front. Apartamentos Gondomar 2.
  caption_pt: Seis pisos, uma fachada calma. Ritmo, sombra e um prado à frente. Apartamentos Gondomar 2.
  approved: true
  caption_li: 'Six floors can easily look like a wall.

    So I worked on rhythm and shade until the facade read as one calm surface, and put a meadow in front to soften the base.

    The building did not change. The way you meet it did.

    Apartamentos Gondomar 2.'
