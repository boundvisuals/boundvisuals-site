<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0c">
<title>Painel · Vítor Hugo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0c; --panel:#121313; --panel2:#181919; --line:#242524; --fg:#e5e5e3; --mut:#8f8b82; --warm:#c5c1b7;
  --ok:#8fbf8f; --warn:#d9b26a; --err:#e07a6a; --info:#8fb0d9; --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.brand{padding:0 10px 22px}
.brand b{display:block;font-weight:500;font-size:16px;letter-spacing:.01em}
.brand span{display:block;color:var(--mut);font-size:12px;font-weight:300;letter-spacing:.08em;text-transform:uppercase}
.tab{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--mut);text-align:left;font-size:14px}
.tab svg{width:19px;height:19px;flex:none}
.tab.on,.tab:hover{background:var(--panel2);color:var(--fg)}
.tab .n{margin-left:auto;font-size:11px;background:var(--warm);color:#0b0c0c;border-radius:20px;padding:1px 7px;font-weight:500}
.side .foot{margin-top:auto;font-size:11px;color:var(--mut);padding:0 12px}
main{min-width:0;padding:calc(28px + var(--safe-t)) max(20px,env(safe-area-inset-right,0px)) 120px max(20px,env(safe-area-inset-left,0px));max-width:1180px;width:100%}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-weight:500;font-size:28px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:30px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(143,191,143,.6);animation:p 2s infinite}
.dot.stale{background:var(--warn);animation:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(143,191,143,.5)}70%{box-shadow:0 0 0 8px rgba(143,191,143,0)}100%{box-shadow:0 0 0 0 rgba(143,191,143,0)}}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-size:13px;font-weight:500;color:var(--mut);margin:0 0 12px;letter-spacing:.06em;text-transform:uppercase}
.kpi b{display:block;font-size:30px;font-weight:500;line-height:1.1}
.kpi span{color:var(--mut);font-size:12px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:10px;font-size:14px}
.alert i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.alert.err i{background:var(--err)}.alert.warn i{background:var(--warn)}.alert.ok i{background:var(--ok)}.alert.info i{background:var(--info)}
.item{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.thumb{width:52px;height:65px;border-radius:8px;object-fit:cover;background:var(--panel2);flex:none}
.thumb.st{width:40px;height:71px}
.item .t{min-width:0;flex:1}
.item .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{color:var(--mut);font-size:12px}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;color:var(--mut)}
.pill.published{color:var(--ok);border-color:rgba(143,191,143,.35)}
.pill.approved{color:var(--info);border-color:rgba(143,176,217,.35)}
.pill.pending{color:var(--warn);border-color:rgba(217,178,106,.35)}
.pill.error{color:var(--err);border-color:rgba(224,122,106,.4)}
.pill.skipped{opacity:.6}
.net{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.net:first-of-type{border-top:0}
.net span{color:var(--mut);font-size:12px;text-align:right}
.day{margin-bottom:18px}
.dayh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.dayh b{font-weight:500}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:10px;font-size:13px}
.btn.pri{background:var(--warm);color:#0b0c0c;border-color:var(--warm);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.post{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.slides{display:flex;gap:4px}
.slides img{width:48px;height:60px;object-fit:cover;border-radius:6px}
.post p{margin:4px 0 0;font-size:13px;color:var(--warm)}
.post .meta{font-size:12px;color:var(--mut)}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.strip img{width:44px;height:78px;object-fit:cover;border-radius:6px;background:var(--panel2)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--mut);background:none;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.chk.on{background:var(--warm);border-color:var(--warm)}
.chk.on::after{content:"";width:10px;height:6px;border:2px solid #0b0c0c;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task.done .tt{color:var(--mut);text-decoration:line-through}
.tt{font-size:14px}
.td{font-size:12px;color:var(--mut);margin-top:2px}
.due{font-size:11px;color:var(--warn);white-space:nowrap;margin-left:auto}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{white-space:nowrap;border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--panel2);color:var(--fg)}
.proj{display:flex;flex-direction:column;gap:10px}
.proj .bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden}
.proj .bar i{display:block;height:100%;background:var(--warm)}
.stats{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.stats b{color:var(--fg);font-weight:500}
.links a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;font-size:14px}
.links a:first-of-type{border-top:0}
.links a span{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.log{font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--mut);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.view{display:none}.view.on{display:block}
nav.bottom{display:none}
.modal{position:fixed;inset:0;background:rgba(5,6,6,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:40;display:none;overflow:auto;padding:calc(20px + var(--safe-t)) max(16px,env(safe-area-inset-right,0px)) calc(30px + var(--safe-b)) max(16px,env(safe-area-inset-left,0px))}
.modal.on{display:block}
.mbox{max-width:980px;margin:0 auto}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.mhead b{font-weight:500;font-size:17px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:20px;line-height:1;flex:none}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.gal img,.gal video{height:auto;width:auto;max-height:min(68vh,620px);max-width:86vw;object-fit:contain;border-radius:10px;scroll-snap-align:center;flex:none;background:var(--panel2)}
.caps{display:grid;gap:12px;margin-top:14px}
.caps div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;color:var(--warm)}
.caps small{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.clickable{cursor:pointer}
.nsel{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;font:inherit;font-size:12px;padding:3px 6px}
.reply.me{border-left-color:var(--ok);margin-left:24px}
.rbox{display:flex;gap:8px;margin-top:10px}.rbox .sinput{flex:1;min-width:0}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.scard img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.sc-b{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px;font-size:11px;color:var(--mut)}
.ced{position:relative;user-select:none;-webkit-user-select:none;touch-action:none;max-width:100%;margin:0 auto}
.ced img{width:100%;display:block;border-radius:8px;pointer-events:none}
.cbox{position:absolute;border:2px solid rgba(229,229,227,.9);box-shadow:0 0 0 9999px rgba(0,0,0,.0);cursor:move;border-radius:2px}
.cbox.on{border-color:var(--warm);box-shadow:0 0 0 9999px rgba(5,6,6,.55);z-index:2}
.cbox i{position:absolute;background:rgba(229,229,227,.55)}
.cbox .v1{left:33.33%;top:0;bottom:0;width:1px}.cbox .v2{left:66.66%;top:0;bottom:0;width:1px}
.cbox .h1{top:33.33%;left:0;right:0;height:1px}.cbox .h2{top:66.66%;left:0;right:0;height:1px}
.cbox b{position:absolute;top:4px;left:6px;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 3px #000}
.cbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.cbar input[type=range]{flex:1;min-width:160px;accent-color:#c5c1b7}
.cprev{display:flex;gap:8px;overflow-x:auto;margin-top:12px}
.cprev canvas{width:96px;height:120px;border-radius:6px;background:var(--panel2);flex:none;border:2px solid transparent}
.cprev canvas.on{border-color:var(--warm)}
.feedg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:520px}
.feedg a,.feedg div.f{position:relative;aspect-ratio:4/5;background:var(--panel2);overflow:hidden;display:block}
.feedg img{width:100%;height:100%;object-fit:cover;display:block}
.feedg .tag{position:absolute;top:6px;left:6px;font-size:10px;background:rgba(11,12,12,.75);color:var(--warm);padding:2px 7px;border-radius:10px}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{position:relative;padding:7px 0;font-size:13px}
.tli:before{content:"";position:absolute;left:-17px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--mut)}
.tli.claude:before{background:var(--warm)}.tli.robot:before{background:var(--info)}.tli.you:before{background:var(--ok)}.tli.pub:before{background:var(--ok);box-shadow:0 0 0 3px rgba(143,191,143,.25)}
.tli span{display:block;font-size:11px;color:var(--mut)}
.spark{width:100%;height:60px}
.sinput{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:inherit;font-size:16px;padding:14px 16px}
.sinput:focus{outline:1px solid var(--warm)}
.sres{margin-top:12px}.sres a,.sres button.r{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 4px;border:0;border-top:1px solid var(--line);background:none;text-decoration:none;font-size:14px}
.sres .k{font-size:11px;color:var(--warm);letter-spacing:.06em;text-transform:uppercase;width:92px;flex:none}
.oform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oform input,.oform select,.oform textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;font-size:14px;padding:10px 12px;min-width:0}
.oform textarea{grid-column:1/-1;min-height:70px}
@media (max-width:860px){.oform{grid-template-columns:1fr}}
.ostages{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;max-width:100%;padding-bottom:8px;margin-top:14px}
.ov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.ov{grid-template-columns:1fr}}
.mini{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.mini:first-of-type{border-top:0}.mini span{color:var(--mut);font-size:12px;white-space:nowrap}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(24px + var(--safe-b));width:56px;height:56px;border-radius:50%;border:0;background:var(--warm);color:#0b0c0c;font-size:30px;line-height:1;box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:30}
@media (max-width:860px){.fab{bottom:calc(84px + var(--safe-b))}}
.spaces{display:grid;gap:6px;margin:0 0 18px}
.spaces button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:none;border-radius:12px;padding:10px 12px}
.spaces button b{font-weight:500;font-size:14px}.spaces button span{font-size:11px;color:var(--mut)}
.spaces button.on{background:var(--panel2);border-color:var(--warm)}
.mspace{display:none;gap:6px;margin-bottom:10px}
.mspace button{border:1px solid var(--line);background:none;border-radius:20px;padding:6px 14px;font-size:13px;color:var(--mut)}
.mspace button.on{background:var(--warm);color:#0b0c0c;border-color:var(--warm);font-weight:500}
@media (max-width:860px){.mspace{display:flex}}
.kan{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));max-width:100%;gap:12px;overflow-x:auto;padding-bottom:8px}
.kan .col h2{display:flex;justify-content:space-between}
.pc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.pc b{font-weight:500;font-size:14px;display:block}.pc .ar{font-size:11px;color:var(--warm);letter-spacing:.06em;text-transform:uppercase}
.pc p{margin:6px 0 0;font-size:12px;color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}table.t th{color:var(--mut);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-top:0}
.tw{overflow-x:auto}
.idea{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.idea:first-of-type{border-top:0}
.idea button{font-size:11px;padding:4px 10px;white-space:nowrap}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.sheet svg{width:24px;height:24px}
.compose{display:grid;gap:10px}
.compose textarea{width:100%;min-height:96px;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:inherit;padding:12px 14px}
.compose textarea:focus{outline:1px solid var(--warm)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags button{border:1px solid var(--line);background:none;border-radius:20px;padding:5px 12px;font-size:12px;color:var(--mut)}
.tags button.on{background:var(--warm);color:#0b0c0c;border-color:var(--warm)}
.note{padding:14px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note .nt{white-space:pre-wrap;font-size:14px}
.note .nm{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--mut);margin-top:6px}
.note .del{margin-left:auto;background:none;border:0;color:var(--mut);font-size:12px;padding:2px 4px}
.reply{margin-top:10px;padding:12px 14px;border-left:2px solid var(--warm);background:var(--panel2);border-radius:0 10px 10px 0;font-size:14px;color:var(--warm);white-space:pre-wrap}
.reply small{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.pgrid{columns:3;column-gap:10px}@media (max-width:860px){.pgrid{columns:2;column-gap:8px}}
.pgrid figure{margin:0 0 10px;break-inside:avoid;position:relative;border-radius:10px;overflow:hidden;cursor:zoom-in;background:var(--panel2)}
.pgrid img{width:100%;display:block}
.pgrid figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#eee;opacity:0;transition:.2s}
.pgrid figure:hover figcaption{opacity:1}
.prof h2{margin-top:6px}
.prof .big{font-size:22px;font-weight:500;line-height:1.3;margin:0 0 6px}
.copyblock{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px;font-size:14px;color:var(--warm);margin:8px 0}
.copyblock small{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.copyblock button{position:absolute;top:10px;right:10px;font-size:12px;padding:4px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--warm)}
.study{margin-bottom:14px}
.study .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer}
.study .num{font-size:12px;color:var(--warm);letter-spacing:.1em}
.study h3{margin:2px 0 0;font-weight:500;font-size:18px}
.study .when{font-size:12px;color:var(--warn);white-space:nowrap}
.sbody{margin-top:12px;display:none}.study.open .sbody{display:block}
.sbody h4{margin:16px 0 6px;font-weight:500;font-size:14px;color:var(--fg)}
.sbody p,.sbody li{font-size:14px;color:var(--warm);margin:4px 0}
.sbody ul{margin:0;padding-left:18px}
.code{position:relative;background:#070808;border:1px solid var(--line);border-radius:10px;padding:14px 14px 14px;margin:8px 0;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#d8d5cd;white-space:pre-wrap;word-break:break-word}
.code button{position:absolute;top:8px;right:8px;font-size:12px;padding:5px 10px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--warm);color:#0b0c0c;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  h1{font-size:24px}

const SPACES={vh:{name:"Vítor Hugo",sub:"Tudo",tabs:[["hoje","Início"],["ideias","Ideias"],["pessoais","Projetos pessoais"],["portfolio","Portfólio"],["opps","Oportunidades"],["sobre","Perfil"],["tarefas","Tarefas"],["links","Links"]],bottom:["hoje","ideias","pessoais","tarefas"]},

let space="vh";try{space=localStorage.getItem("bv_space")||"vh"}catch(e){}

const ST={published:"Publicado",approved:"Aprovado",pending:"Por aprovar",error:"Erro",skipped:"Saltado"};
const TY={feed:"Post",story:"Story",reel:"Reel"};
let D=null,cur="hoje",calF="todos",taskF="vitor",lastOk=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WD=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"],MO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmtDay=d=>{const x=new Date(d+"T12:00:00");return `${WD[x.getDay()]} ${x.getDate()} ${MO[x.getMonth()]}`};
const todayISO=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function nav(){
  const badge={ideias:(D?.inbox||[]).filter(n=>(D.replies||{})[n.id]&&!seenReply(n.id)).length,tarefas:(D?.tasks||[]).filter(t=>t.owner==="vitor"&&!isDone(t)).length,cal:pendingCount()};
  const h=(cls)=>TABS.map(([k,l])=>`<button class="tab ${cur===k?"on":""}" data-k="${k}">${ICON[k]}<span>${l}</span>${badge[k]?`<span class="n">${badge[k]}</span>`:""}</button>`).join("");
  const sw=`<div class="spaces">${Object.entries(SPACES).map(([k,v])=>`<button class="${space===k?"on":""}" data-sp="${k}"><b>${v.name}</b><span>${v.sub}</span></button>`).join("")}</div>`;
  $("#side").innerHTML=`<div class="brand"><b>Vítor Hugo</b><span>Hub</span></div>${sw}${h()}<div class="foot" id="gen"></div>`;
  $("#bottom").innerHTML=TABS.filter(([k])=>BOTTOM.includes(k)).map(([k,l])=>`<button class="tab ${cur===k?"on":""}" data-k="${k}">${ICON[k]}<span>${l}</span>${badge[k]?`<span class="n">${badge[k]}</span>`:""}</button>`).join("")+`<button class="tab ${BOTTOM.includes(cur)?"":"on"}" data-more="1">${ICON.mais}<span>Mais</span></button>`;
  const mb=$("#bottom [data-more]");if(mb)mb.onclick=openMore;
  document.querySelectorAll(".tab[data-k]").forEach(b=>b.onclick=()=>go(b.dataset.k));
  document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>setSpace(b.dataset.sp));
  $("#mspace").innerHTML=Object.entries(SPACES).map(([k,v])=>`<button class="${space===k?"on":""}" data-sp="${k}">${v.name}</button>`).join("");
  $("#mspace").querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>setSpace(b.dataset.sp));
  if(D)$("#gen").textContent="Dados dos robôs: "+ago(D.generated_at);
}
function setSpace(sp){space=sp;try{localStorage.setItem("bv_space",sp)}catch(e){}TABS=SPACES[sp].tabs;BOTTOM=SPACES[sp].bottom;go(TABS[0][0])}
function go(k){cur=k;if(k==="ideias"&&D){markSeen()}try{localStorage.setItem("bv_tab",k)}catch(e){}
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+k));
  $("#title").textContent=(ALLTABS.find(t=>t[0]===k)||[0,""])[1];nav();window.scrollTo(0,0)}
function ago(iso){if(!iso)return"—";const s=Math.max(0,(Date.now()-new Date(iso))/1000);
  if(s<60)return"agora mesmo";if(s<3600)return`há ${Math.round(s/60)} min`;if(s<86400)return`há ${Math.round(s/3600)} h`;return`há ${Math.round(s/86400)} dias`}
function isDone(t){const k=D.ticks&&D.ticks[t.id];return k?k.done:!!t.done}
function allItems(){return (D.calendar||[]).flatMap(d=>d.items.map(i=>({...i,date:d.date})))}
function effStatus(i){const a=D.pending_approvals&&D.pending_approvals[i.key];
  if(a&&typeof a==="object"&&a.v===false)return(i.status==="approved"||i.status==="pending")?"pending":i.status;
  if(i.status==="pending"&&a)return"approved";return i.status}
function reviewed(i){return i.type!=="feed"||!i.stem||!!(D.reviews&&D.reviews[i.key])}
function pendingCount(){return D?allItems().filter(i=>effStatus(i)==="pending").length:0}
function itemRow(i){
  const st=effStatus(i);const th=i.thumb?`<img class="thumb ${i.type!=="feed"?"st":""}" loading="lazy" src="${esc(i.thumb)}" alt="">`:`<div class="thumb"></div>`;
  return `<div class="item clickable" data-open="${esc(i.key)}">${th}<div class="t"><b>${esc(i.time)} · ${TY[i.type]} · ${esc(i.project_title)}</b><span>${esc(i.caption||i.note||"")}</span></div>${i.link?`<a class="pill published" href="${esc(i.link)}" target="_blank" rel="noopener">Ver ↗</a>`:`<span class="pill ${st}">${ST[st]||st}</span>`}</div>`
}
function renderHoje(){
  const t=todayISO();const its=allItems().filter(i=>i.date===t);
  const pub=allItems().filter(i=>i.status==="published").length;
  const myOpen=(D.tasks||[]).filter(x=>x.owner==="vitor"&&!isDone(x)).length;
  const queueDays=new Set(allItems().filter(i=>i.type==="feed"&&["approved","published"].includes(effStatus(i))&&i.date>=t).map(i=>i.date)).size;
  $("#v-hoje").innerHTML=`
  ${(D.alerts||[]).map(a=>`<div class="alert ${a.level}"><i></i><div>${esc(a.text)}</div></div>`).join("")}
  <div class="grid g4" style="margin:14px 0">
    <div class="card kpi"><b>${its.length}</b><span>publicações hoje</span></div>
    <div class="card kpi"><b>${queueDays}</b><span>dias de posts aprovados</span></div>
    <div class="card kpi"><b>${pendingCount()}</b><span>por aprovar</span></div>
    <div class="card kpi"><b>${myOpen}</b><span>tarefas tuas</span></div>
  </div>
  <div class="ov" style="margin-bottom:14px">
    <div class="card"><h2>Projetos pessoais em curso</h2>${(D.personal||[]).filter(p=>p.stage==="em-curso"||p.stage==="explorar").map(p=>`<div class="mini"><div>${esc(p.title)}</div><span>${esc(p.area||"")}</span></div>`).join("")||`<div class="empty">—</div>`}</div>
    <div class="card"><h2>Ideias recentes</h2>${(D.inbox||[]).slice(0,4).map(n=>`<div class="mini"><div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.text)}</div><span>${ago(n.at)}</span></div>`).join("")||`<div class="empty">Usa o botão + para apontar.</div>`}</div>
    <div class="card"><h2>Oportunidades ativas</h2>${(D.opps||[]).filter(o=>!["ganha","perdida"].includes(o.stage)).slice(0,4).map(o=>`<div class="mini"><div>${esc(o.title)}</div><span>${esc((OST.find(s=>s[0]===o.stage)||[0,""])[1])}</span></div>`).join("")||`<div class="empty">Nenhuma ainda.</div>`}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Hoje · ${fmtDay(t)}</h2>${its.length?its.sort((a,b)=>a.time.localeCompare(b.time)).map(itemRow).join(""):`<div class="empty">Nada agendado para hoje.</div>`}</div>
    <div class="grid" style="align-content:start">
      <div class="card"><h2>Redes</h2>${(D.networks||[]).map(n=>`<div class="net"><div>${esc(n.name)}</div><span class="${n.level||""}">${esc(n.status)}</span></div>`).join("")}</div>
      <div class="card"><h2>Próximas tarefas tuas</h2>${(D.tasks||[]).filter(x=>x.owner==="vitor"&&!isDone(x)).slice(0,4).map(taskRow).join("")||`<div class="empty">Nada pendente.</div>`}</div>
    </div>
  </div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h2>Linha do tempo</h2><div class="tl">${(D.timeline||[]).slice(0,18).map(t=>`<div class="tli ${t.kind}">${t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.text)} ↗</a>`:esc(t.text)}<span>${ago(t.at)} · ${({claude:"Claude",robot:"Robô",you:"Tu",pub:"Publicação"})[t.kind]||""}</span></div>`).join("")}</div></div>
  <div class="card"><h2>Último robô de publicação</h2><div class="log">${esc((D.log||[]).join("\n"))}</div></div></div>`;
  bindTasks($("#v-hoje"));
}
function renderCal(){
  const t=todayISO();
  const f=calF;const days=(D.calendar||[]).filter(d=>d.date>=t||d.items.some(i=>i.status!=="published"&&i.status!=="skipped"&&d.date>=addDays(t,-2)));
  const head=`<div class="seg">${[["todos","Tudo"],["feed","Posts"],["story","Stories"],["reel","Reels"],["pending","Por aprovar"]].map(([k,l])=>`<button class="${f===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>`;
  const body=days.map(d=>{
    let its=d.items;if(f==="pending")its=its.filter(i=>effStatus(i)==="pending");else if(f!=="todos")its=its.filter(i=>i.type===f);
    if(!its.length)return"";
    const pend=its.filter(i=>effStatus(i)==="pending");
    const feeds=its.filter(i=>i.type==="feed"),reels=its.filter(i=>i.type==="reel"),stories=its.filter(i=>i.type==="story");
    return `<div class="day"><div class="dayh"><b>${fmtDay(d.date)}</b>${pend.length?`<button class="btn pri" data-ap='${esc(JSON.stringify(pend.map(i=>i.key)))}'>Aprovar dia (${pend.length})</button>`:""}</div>
    ${[...feeds,...reels].map(i=>`<div class="post clickable" data-open="${esc(i.key)}"><div class="slides">${(i.slides||[i.thumb]).filter(Boolean).slice(0,4).map(s=>`<img loading="lazy" src="${esc(s)}" alt="">`).join("")}</div>
      <div><div class="meta">${esc(i.time)} · ${TY[i.type]} · ${esc(i.project_title)}</div><p>${esc(i.caption||"")}</p></div>
      <div class="act" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${i.link?`<a class="pill published" href="${esc(i.link)}" target="_blank" rel="noopener">Ver ↗</a>`:`<span class="pill ${effStatus(i)}">${ST[effStatus(i)]}</span>`}${i.stem&&!i.link&&i.type==="feed"?(reviewed(i)?`<span class="pill approved">Recortes ✓</span>`:`<span class="pill pending">Ver recortes</span>`):""}${actBtns(i)}</div></div>`).join("")}
    ${stories.length?`<div class="sgrid">${stories.map(s=>`<div class="scard"><img class="clickable" data-open="${esc(s.key)}" loading="lazy" src="${esc(s.thumb)}" alt=""><div class="sc-b"><span>${esc(s.time)} · Story</span><span class="pill ${effStatus(s)}">${ST[effStatus(s)]}</span>${s.stem&&effStatus(s)!=="published"?`<button class="btn sm" data-scrop="${esc(s.key)}">✎</button>`:""}${actBtns(s)}</div></div>`).join("")}</div>`:""}

  const allPend=allItems().filter(i=>effStatus(i)==="pending").map(i=>i.key);
  $("#v-cal").innerHTML=head+(allPend.length?`<div class="alert warn"><i></i><div style="flex:1">${allPend.length} publicações à espera do teu ✅.</div><button class="btn pri" data-ap='${esc(JSON.stringify(allPend))}'>Aprovar tudo</button></div>`:"")+(body||`<div class="empty">Nada neste filtro.</div>`);
  $("#v-cal").querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{calF=b.dataset.f;renderCal()});
  $("#v-cal").querySelectorAll("[data-ap]").forEach(b=>b.onclick=e=>{e.stopPropagation();approve(JSON.parse(b.dataset.ap),b)});
  $("#v-cal").querySelectorAll("[data-un]").forEach(b=>b.onclick=e=>{e.stopPropagation();approve([b.dataset.un],b,true)});
  $("#v-cal").querySelectorAll("[data-one]").forEach(b=>b.onclick=e=>{e.stopPropagation();const it=allItems().find(x=>x.key===b.dataset.one);if(!reviewed(it)){openItem(it.key);toast("Primeiro aceita ou edita os recortes");return}approve([it.key],b)});
  $("#v-cal").querySelectorAll("[data-scrop]").forEach(b=>b.onclick=e=>{e.stopPropagation();const it=allItems().find(x=>x.key===b.dataset.scrop);cropEditor(it,"story",it.story_idx)});
}
function actBtns(i){const st=effStatus(i);if(i.link||st==="published"||st==="skipped")return"";
  return st==="approved"?`<button class="btn sm" data-un="${esc(i.key)}" title="Desaprovar">↺ Desaprovar</button>`:`<button class="btn sm pri" data-one="${esc(i.key)}">✓ Aprovar</button>`}
function addDays(iso,n){const x=new Date(iso+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
async function approve(keys,btn,undo){if(btn)btn.disabled=true;
  try{const r=await fetch("api.php?a=approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(undo?{keys,value:false}:{keys})});
    if(!r.ok)throw 0;D.pending_approvals=D.pending_approvals||{};keys.forEach(k=>{D.pending_approvals[k]=undo?{v:false,at:new Date().toISOString()}:new Date().toISOString()});
    toast(undo?"Desaprovado ↺":"Aprovado ✓");renderAll();undoBar(undo?"Desaprovado":"Aprovado "+keys.length,()=>approve(keys,null,!undo))}catch(e){if(btn)btn.disabled=false;toast("Não consegui gravar. Tenta outra vez.")}}
let undoT=null;
function undoBar(text,fn){const e=$("#toast");e.innerHTML=`${esc(text)} · <button style="background:none;border:0;font:inherit;font-weight:600;text-decoration:underline;color:inherit;pointer-events:auto" id="undoB">Anular</button>`;e.classList.add("on");e.style.pointerEvents="auto";
  $("#undoB").onclick=()=>{e.classList.remove("on");e.style.pointerEvents="none";fn()};clearTimeout(undoT);undoT=setTimeout(()=>{e.classList.remove("on");e.style.pointerEvents="none"},7000)}
async function review(i,undo){try{const r=await fetch("api.php?a=review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:i.key,how:"aceite",undo:!!undo})});const j=await r.json();if(!j.ok)throw 0;D.reviews=j.reviews;renderAll();openItem(i.key);if(!undo)undoBar("Recortes aceites",()=>review(i,true))}catch(e){toast("Sem ligação")}}
function taskRow(t){const d=isDone(t);return `<div class="task ${d?"done":""}"><button class="chk ${d?"on":""}" data-t="${esc(t.id)}" aria-label="concluir"></button><div style="flex:1;min-width:0"><div class="tt">${esc(t.title)}</div>${t.detail?`<div class="td">${esc(t.detail)}</div>`:""}</div>${t.due?`<span class="due">${esc(t.due)}</span>`:""}</div>`}
function bindTasks(root){root.querySelectorAll("[data-t]").forEach(b=>b.onclick=async()=>{
  const id=b.dataset.t;const t=D.tasks.find(x=>x.id===id);const nd=!isDone(t);D.ticks=D.ticks||{};D.ticks[id]={done:nd};renderAll();
  try{await fetch("api.php?a=task",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,done:nd})});toast(nd?"Feito ✓":"Reaberto")}catch(e){toast("Sem ligação")}})}
function renderTarefas(){
  const groups=[["vitor","Tuas"],["claude","Minhas (Claude)"],["parked","Para depois"]];
  const head=`<div class="seg">${groups.map(([k,l])=>`<button class="${taskF===k?"on":""}" data-g="${k}">${l} (${(D.tasks||[]).filter(t=>t.owner===k&&!isDone(t)).length})</button>`).join("")}</div>`;
  const list=(D.tasks||[]).filter(t=>t.owner===taskF);

    try{const r=await fetch("api.php?a=note",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,tag:tg})});const j=await r.json();if(!j.ok)throw 0;D.inbox=j.inbox;closeModal();toast("Apontado ✓");renderIdeias()}catch(e){$("#qSave").disabled=false;toast("Não consegui guardar")}}}
$("#fab").onclick=quick;
$("#sico").innerHTML=ICON.search;
const OST=[["encontrada","Encontrada"],["enviada","Enviada"],["resposta","Resposta"],["entrevista","Entrevista"],["proposta","Proposta"],["ganha","Ganha"],["perdida","Perdida"]];
function oppForm(o){o=o||{};$("#mbox").innerHTML=`<div class="mhead"><b>${o.id?"Editar":"Nova"} oportunidade</b><button class="x" id="mx">×</button></div><div class="card"><div class="oform">
  <select id="oKind"><option value="vaga" ${o.kind!=="cliente"?"selected":""}>Vaga de emprego</option><option value="cliente" ${o.kind==="cliente"?"selected":""}>Cliente / projeto</option></select>
  <select id="oStage">${OST.map(([k,l])=>`<option value="${k}" ${o.stage===k?"selected":""}>${l}</option>`).join("")}</select>
  <input id="oTitle" placeholder="Função ou projeto" value="${esc(o.title||"")}"><input id="oOrg" placeholder="Empresa / cliente" value="${esc(o.org||"")}">
  <input id="oUrl" placeholder="Link (anúncio, site, email)" value="${esc(o.url||"")}" style="grid-column:1/-1">
  <textarea id="oNotes" placeholder="Notas: contacto, valores, prazos, o que enviar…">${esc(o.notes||"")}</textarea></div>
  <div style="display:flex;justify-content:space-between;margin-top:12px;gap:8px">${o.id?`<button class="btn" id="oDel">Apagar</button>`:"<span></span>"}<button class="btn pri" id="oSave">Guardar</button></div></div>`;
  $("#modal").classList.add("on");$("#mx").onclick=closeModal;
  const send=async body=>{const r=await fetch("api.php?a=opp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw 0;D.opps=j.opps;closeModal();renderOpps();renderHoje()};
  $("#oSave").onclick=()=>send({id:o.id,kind:$("#oKind").value,stage:$("#oStage").value,title:$("#oTitle").value,org:$("#oOrg").value,url:$("#oUrl").value,notes:$("#oNotes").value}).then(()=>toast("Guardado ✓")).catch(()=>toast("Falta o título ou sem ligação"));
  const d=$("#oDel");if(d)d.onclick=()=>{if(d.dataset.c!=="1"){d.dataset.c="1";d.textContent="Tens a certeza?";return}send({delete:o.id}).then(()=>toast("Apagado"))}}
function renderOpps(){const O=D.opps||[];
  $("#v-opps").innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><p class="sub" style="margin:0">Vagas e clientes, do primeiro contacto ao fecho. Para cada uma preparo o portfólio, o CV e a carta certos.</p><button class="btn pri" id="oNew">+ Nova</button></div>
  <div class="ostages">${OST.map(([k,l])=>{const it=O.filter(o=>o.stage===k);return `<div class="card"><h2 style="display:flex;justify-content:space-between"><span>${l}</span><span>${it.length}</span></h2>${it.map(o=>`<div class="pc clickable" data-opp="${esc(o.id)}"><span class="ar">${o.kind==="cliente"?"Cliente":"Vaga"}</span><b>${esc(o.title)}</b><p>${esc(o.org||"")}</p></div>`).join("")||`<div class="empty">—</div>`}</div>`}).join("")}</div>`;
  $("#oNew").onclick=()=>oppForm();
  $("#v-opps").querySelectorAll("[data-opp]").forEach(c=>c.onclick=()=>oppForm(O.find(o=>o.id===c.dataset.opp)))}
function search(){$("#mbox").innerHTML=`<div class="mhead"><b>Pesquisar tudo</b><button class="x" id="mx">×</button></div><input class="sinput" id="sq" placeholder="Projeto, tarefa, ideia, legenda, link…" autocomplete="off"><div class="sres" id="sr"></div>`;
  $("#modal").classList.add("on");$("#mx").onclick=closeModal;setTimeout(()=>$("#sq").focus(),50);
  const idx=[];
  (D.tasks||[]).forEach(t=>idx.push({k:"Tarefa",t:t.title,d:t.detail||"",go:"tarefas"}));
  (D.inbox||[]).forEach(n=>idx.push({k:"Ideia",t:n.text,d:"",go:"ideias"}));
  (D.personal||[]).forEach(p=>idx.push({k:"Projeto pessoal",t:p.title,d:p.next||"",go:"pessoais"}));
  (D.projects||[]).forEach(p=>idx.push({k:"Projeto",t:p.title,d:p.status||"",go:"projetos"}));
  (D.opps||[]).forEach(o=>idx.push({k:"Oportunidade",t:o.title,d:o.org||"",go:"opps"}));
  (D.links||[]).forEach(l=>idx.push({k:"Link",t:l.title,d:l.url,url:l.url}));
  (D.studies||[]).forEach(s=>idx.push({k:"Daily Study",t:s.num+" "+s.title,d:s.when,go:"estudio"}));
  Object.values((D.content_plan||{}).daily_ideas||{}).flat().forEach(x=>idx.push({k:"Ideia DS",t:x,d:"",go:"conteudo"}));
  ((D.content_plan||{}).pillars||[]).forEach(p=>idx.push({k:"Pilar",t:p.name,d:p.what,go:"conteudo"}));
  allItems().forEach(i=>idx.push({k:TY[i.type],t:i.project_title+" · "+fmtDay(i.date)+" "+i.time,d:i.caption||"",key:i.key}));
  const norm=x=>String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  $("#sq").oninput=()=>{const q=norm($("#sq").value.trim());if(q.length<2){$("#sr").innerHTML="";return}
    const r=idx.filter(x=>norm(x.t+" "+x.d).includes(q)).slice(0,40);
    $("#sr").innerHTML=r.map((x,n)=>x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener"><span class="k">${esc(x.k)}</span><span>${esc(x.t)}</span></a>`:`<button class="r" data-n="${n}"><span class="k">${esc(x.k)}</span><span>${esc(x.t)}</span></button>`).join("")||`<div class="empty">Nada encontrado.</div>`;
    $("#sr").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const x=r[+b.dataset.n];closeModal();if(x.key){openItem(x.key);return}
      const sp=Object.keys(SPACES).find(k=>SPACES[k].tabs.some(t=>t[0]===x.go));if(sp&&sp!==space){setSpace(sp)}go(x.go)})}}
$("#sbtn").onclick=search;
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();search()}});
function spark(h){const e=Object.entries(h||{}).sort();if(e.length<2)return"";const v=e.map(x=>+x[1]||0),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*300).toFixed(1)},${(55-(y-mn)/r*50).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 300 60" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--warm)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function renderMarca(){const st=D.stats||{},ac=st.account||{},M=st.media||[];const t=todayISO();
  const fut=allItems().filter(i=>i.type==="feed"&&i.date>=t&&!["published","skipped"].includes(i.status)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const fol=Object.values(D.followers||{}).map(Number);const d7=fol.length>1?fol[fol.length-1]-fol[Math.max(0,fol.length-8)]:null;
  $("#v-marca").innerHTML=`<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><b>${ac.followers_count??"—"}</b><span>seguidores${d7!==null?` · ${d7>=0?"+":""}${d7} esta semana`:""}</span></div>
    <div class="card kpi"><b>${ac.media_count??"—"}</b><span>publicações no Instagram</span></div>
    <div class="card kpi"><b>${st.reach_7d??"—"}</b><span>alcance 7 dias</span></div>
    <div class="card kpi"><b>${fut.length}</b><span>posts na fila</span></div></div>
  ${st.error?`<div class="alert warn"><i></i><div>Números do Instagram indisponíveis: ${esc(st.error)}</div></div>`:""}
  <div class="grid g2"><div class="card"><h2>O teu feed: o que vem + o que já saiu</h2><div class="feedg">
    ${fut.map(i=>`<div class="f clickable" data-open="${esc(i.key)}"><img loading="lazy" src="${esc(i.thumb)}" alt=""><span class="tag">${fmtDay(i.date)}</span></div>`).join("")}
    ${M.map(m=>`<a href="${esc(m.permalink)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(m.img)}" alt=""></a>`).join("")}</div>
    <div class="sub" style="margin-top:8px">${st.at?`Instagram lido ${ago(st.at)}`:"Números chegam com o próximo robô de estatísticas."}</div></div>
   <div class="grid" style="align-content:start"><div class="card"><h2>Seguidores</h2>${spark(D.followers)||`<div class="empty">A curva aparece a partir do 2.º dia.</div>`}</div>
    <div class="card"><h2>Melhores posts recentes</h2>${M.slice().sort((a,b)=>((b.like_count||0)+(b.comments_count||0)*3)-((a.like_count||0)+(a.comments_count||0)*3)).slice(0,5).map(m=>`<div class="mini"><a href="${esc(m.permalink)}" target="_blank" rel="noopener" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.caption||"(sem legenda)")}</a><span>♥ ${m.like_count??0} · 💬 ${m.comments_count??0}</span></div>`).join("")||`<div class="empty">—</div>`}</div>
    <div class="card"><h2>Redes</h2>${(D.networks||[]).map(n=>`<div class="net"><div>${esc(n.name)}</div><span>${esc(n.status)}</span></div>`).join("")}</div></div></div>`}
function cropEditor(it,mode,startSel){mode=mode||"post";const AR=mode==="story"?.5625:.8;
  let C=((mode==="story"?it.story_crops:it.crops)||[]).map(c=>c.slice());if(!C.length)C=[[.5,.5,1]];let sel=Math.min(startSel||0,C.length-1);const R=it.orig_ratio;
  $("#mbox").innerHTML=`<div class="mhead"><div><div class="sub">${esc(it.project_title)} · grelha dos terços</div><b>Editar recortes</b></div><button class="x" id="mx">×</button></div>
  <div class="seg"><button class="${mode==="post"?"on":""}" data-cm="post">Post 4:5</button><button class="${mode==="story"?"on":""}" data-cm="story">Stories 9:16</button></div>
  <div class="ced" id="ced"><img id="cimg" src="${esc(it.orig)}" alt=""></div>
  <div class="cbar"><span class="sub">Tamanho</span><input type="range" id="csz" min="0.25" max="1" step="0.005"><button class="btn" id="cadd">+ Recorte</button><button class="btn" id="cdel">Apagar este</button></div>
  <div class="cprev" id="cprev"></div>
  <div class="cbar" style="justify-content:space-between"><span class="sub">${mode==="story"?"Stories em ecrã inteiro: o 1.º é a abertura, os outros os pormenores.":"Arrasta a moldura. O último slide (imagem inteira em branco) é sempre acrescentado."}</span><button class="btn pri" id="csave">Guardar recortes</button></div>`;
  $("#modal").classList.add("on");$("#mx").onclick=closeModal;
  $("#mbox").querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>cropEditor(it,b.dataset.cm,mode==="story"?0:sel));
  const ced=$("#ced"),img=$("#cimg");
  const geom=c=>{const W=ced.clientWidth,H=W/R;let ch=Math.min(c[2]*H,H),cw=AR*ch;if(cw>W){cw=W;ch=Math.min(cw/AR,H)}
    let x=c[0]*W-cw/2,y=c[1]*H-ch/2;x=Math.min(Math.max(x,0),W-cw);y=Math.min(Math.max(y,0),H-ch);return{x,y,w:cw,h:ch,W,H}};
  const draw=()=>{ced.querySelectorAll(".cbox").forEach(b=>b.remove());
    C.forEach((c,n)=>{const g=geom(c);const b=document.createElement("div");b.className="cbox"+(n===sel?" on":"");b.style.cssText=`left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px`;
      b.innerHTML=`<i class="v1"></i><i class="v2"></i><i class="h1"></i><i class="h2"></i><b>${n+1}</b>`;b.dataset.n=n;ced.appendChild(b)});
    $("#csz").value=C[sel][2];prev()};
  const prev=()=>{const pv=$("#cprev");pv.innerHTML="";C.forEach((c,n)=>{const g=geom(c),cv=document.createElement("canvas");cv.width=mode==="story"?135:192;cv.height=240;cv.style.width=mode==="story"?"68px":"96px";cv.className=n===sel?"on":"";
    const k=img.naturalWidth/g.W;try{cv.getContext("2d").drawImage(img,g.x*k,g.y*k,g.w*k,g.h*k,0,0,cv.width,240)}catch(e){}cv.onclick=()=>{sel=n;draw()};pv.appendChild(cv)})};
  let drag=null;
  ced.addEventListener("pointerdown",e=>{const b=e.target.closest(".cbox");if(!b)return;sel=+b.dataset.n;const g=geom(C[sel]);const r=ced.getBoundingClientRect();
    drag={dx:e.clientX-r.left-g.x-g.w/2,dy:e.clientY-r.top-g.y-g.h/2};ced.setPointerCapture(e.pointerId);draw()});
  ced.addEventListener("pointermove",e=>{if(!drag)return;const r=ced.getBoundingClientRect(),g=geom(C[sel]);
    let cx=(e.clientX-r.left-drag.dx),cy=(e.clientY-r.top-drag.dy);cx=Math.min(Math.max(cx,g.w/2),g.W-g.w/2);cy=Math.min(Math.max(cy,g.h/2),g.H-g.h/2);
    C[sel][0]=+(cx/g.W).toFixed(3);C[sel][1]=+(cy/g.H).toFixed(3);const b=ced.querySelector(`.cbox[data-n="${sel}"]`);const ng=geom(C[sel]);b.style.left=ng.x+"px";b.style.top=ng.y+"px"});
  ced.addEventListener("pointerup",()=>{if(drag){drag=null;prev()}});
  $("#csz").oninput=e=>{C[sel][2]=+(+e.target.value).toFixed(3);draw()};
  $("#cadd").onclick=()=>{if(C.length>=6)return toast("Máximo 6 recortes");C.push([.5,.5,.6]);sel=C.length-1;draw()};
  $("#cdel").onclick=()=>{if(C.length<=1)return toast("Fica pelo menos 1");C.splice(sel,1);sel=0;draw()};
  $("#csave").onclick=async()=>{const b=$("#csave");b.disabled=true;
    C=C.map(c=>{const g=geom(c);return[+((g.x+g.w/2)/g.W).toFixed(3),+((g.y+g.h/2)/g.H).toFixed(3),+(g.h/g.H).toFixed(3)]});
    try{const r=await fetch("api.php?a=crops",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project:it.project,stem:it.stem,crops:C,kind:mode,item_key:it.key,previous:(mode==="story"?it.story_crops:it.crops)})});if(!r.ok)throw 0;const j=await r.json();
      const prevC=(mode==="story"?it.story_crops:it.crops);if(mode==="story")it.story_crops=C;else it.crops=C;D.reviews=D.reviews||{};D.reviews[it.key]={how:"editado"};closeModal();renderAll();
      undoBar(j.robot==="started"?"Recortes guardados, robô a refazer":"Recortes guardados",async()=>{await fetch("api.php?a=crops",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project:it.project,stem:it.stem,crops:prevC,kind:mode})});if(mode==="story")it.story_crops=prevC;else it.crops=prevC;toast("Recortes repostos ↺")})}catch(e){b.disabled=false;toast("Não consegui guardar")}};
  if(img.complete)draw();else img.onload=draw;window.addEventListener("resize",()=>{if($("#ced"))draw()},{once:true})}
function renderAll(){if(!D)return;nav();renderHoje();renderCal();renderTarefas();renderIdeias();renderPortfolio();renderProjetos();renderEstudio();renderSobre();renderLinks();renderPessoais();renderConteudo();renderOpps();renderMarca()}
async function load(){
  try{const r=await fetch("api.php?a=data",{cache:"no-store"});if(r.status===401){location.reload();return}
    const j=await r.json();const changed=!D||j.generated_at!==D.generated_at||JSON.stringify(j.pending_approvals)!==JSON.stringify(D.pending_approvals)||JSON.stringify(j.ticks)!==JSON.stringify(D.ticks);
    D=j;lastOk=Date.now();if(changed)renderAll();tick()}catch(e){$("#dot").classList.add("stale");$("#fresh").textContent="sem ligação, a tentar…"}}
function tick(){if(!D)return;const s=(Date.now()-lastOk)/1000;$("#dot").classList.toggle("stale",s>60);
  $("#fresh").textContent=`ao vivo · robôs ${ago(D.generated_at)}`;if($("#gen"))$("#gen").textContent="Dados dos robôs: "+ago(D.generated_at)}
const h=new Date().getHours();$("#hello").textContent=(h<6?"Boa noite":h<13?"Bom dia":h<20?"Boa tarde":"Boa noite")+", Vítor";
cur=TABS[0][0];try{const t=localStorage.getItem("bv_tab");if(t&&TABS.some(x=>x[0]===t))cur=t}catch(e){}
nav();go(cur);load();setInterval(load,15000);setInterval(tick,5000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
