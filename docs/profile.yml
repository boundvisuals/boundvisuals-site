    • ArchViz: exteriores e interiores fotorrealistas, lookdev, iluminação, pós-produção, planos cinematográficos e pré-visualizações em tempo real.
    • CGI de produto: imagens e pequenos spots animados com detalhe e realismo.
    • Imagem e vídeo com AI: geração, inpainting, upscaling, limpeza de artefactos e personagens fotorrealistas com lip-sync (ComfyUI, Kling, Veo 3, Seedance, Nano Banana, FloraAI).
    • Anúncios de performance: criativos estáticos, motion e UGC para Meta, LinkedIn, Reddit e Google, otimizados com dados reais.

    Desde 2021 tenho a Bound Visuals, o meu estúdio de 3D para arquitetura e produto. Desde 2024 desenho também anúncios de performance para a GrowthHit, uma agência de crescimento dos EUA, onde trouxe a AI para o processo criativo da equipa.

    Como trabalho: briefing claro → protótipos rápidos → ciclos curtos de revisão → entrega final controlada. Versões organizadas, ficheiros limpos, comunicação direta. Aberto a testes de arte e provas de conceito.

