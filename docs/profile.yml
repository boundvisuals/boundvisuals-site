      Desde 2021 dirijo a Bound Visuals, o meu estúdio de 3D para arquitetura e produto: exteriores e interiores fotorrealistas, lookdev, iluminação, pós-produção e planos cinematográficos para promotores, arquitetos e estúdios internacionais, quase sempre com prazos apertados. Entrego cada projeto com versões organizadas e bibliotecas de assets limpas, porque o próximo pedido de alteração chega sempre.

      Desde 2024 trabalho também como Performance Ads Designer na GrowthHit, uma agência de crescimento dos EUA, onde produzo criativos estáticos, em movimento e UGC para Meta, LinkedIn, Reddit e Google. Esse trabalho ensinou-me rapidez, iteração semanal e decisões com base em dados reais, não só em gosto.

