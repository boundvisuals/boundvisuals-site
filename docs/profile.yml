cover_letters:
  - id: general_en
    title: "Geral · EN (vaga 3D/ArchViz com AI)"
    lang: en
    pdf: Cover_Letter_EN.pdf
    subject: "Application — 3D Artist (ArchViz & AI)"
    text: |-
      Dear Hiring Team,

      I'm Vítor Hugo, a 3D artist from Portugal. I build architectural and product images in 3ds Max, Corona and Unreal Engine, and I finish them with AI without losing the craft. I'm writing because I'd like to bring that combination to [Company].

      Since 2021 I've run Bound Visuals, my own 3D studio for architecture and product: photoreal exteriors and interiors, lookdev, lighting, post-production and cinematic shots for developers, architects and international studios, usually on tight deadlines. Every project is delivered with clean versioning and organised asset libraries, because the next change request always comes.

      Since 2024 I've also worked as a Performance Ads Designer for GrowthHit, a US growth agency, producing static, motion and UGC creatives for Meta, LinkedIn, Reddit and Google. That job taught me speed, weekly iteration and decisions based on real data, not taste alone.

      What makes me different is how I use AI. In my pipeline it isn't a shortcut, it's a set of controlled tools: ComfyUI workflows with ControlNet, inpainting, upscaling and artefact cleanup on top of a real 3D base, so every angle of a project stays coherent. I also produce AI video (Kling, Veo 3, Seedance) when a still isn't enough.

      What I'd bring to your team:
      • Photoreal ArchViz from model to final image, with my own post-production.
      • AI integrated into production in a way that saves time without lowering quality.
      • Fast, clear communication in English (C2) and a calm way of working under deadlines.
      • Openness to relocating (French- or German-speaking Switzerland) or working remotely with international teams.

      My portfolio is attached and at boundvisuals.com. I publish new work every day on Instagram (@vitorhugo_boundvisuals). I'm happy to do an art test or a short proof of concept.

      Thank you for your time. I'd be glad to talk.

      Best regards,
      Vítor Hugo
