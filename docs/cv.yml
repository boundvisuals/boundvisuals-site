presentation:
  - "I’m a 3D Artist specialized in Architectural Visualization (ArchViz) and product CGI, experienced in producing photoreal renders, real-time previews and animations with Unreal Engine, Blender, Corona Renderer, KLING, VEO 3, and more."
  - "Since early on, my dream has been to dive into cinema and the broader world of imagery — especially 3D. That passion drives me to keep learning, growing, winning and aiming high. I also care deeply about supporting others, because creativity thrives in collaboration."
  - "In parallel, I work as a Performance Ads Designer (US agency, 2024–present), creating end-to-end creatives for Meta, LinkedIn, Reddit and Google: static, motion and UGC. I operate with fast iteration cycles and a data-driven mindset, preserving brand consistency and execution quality."
  - "Key differentiator: advanced, professional AI applied to image and video. I integrate AI across the pipeline without sacrificing fidelity or craft: from from-scratch generation and visual ideation, to editing and enhancement (inpainting, upscaling, artifact correction, denoising), plus automation of creative workflows to accelerate delivery while keeping artistic control."
  - "Tooling I master: ComfyUI, KLING, VEO 3, ArcadsAI, Runway, Google Gemini, Nano Banana, Visual Electric, Reve Image, etc."
deliver:
  - "ArchViz — photoreal exteriors/interiors, materials/lookdev, lighting, post; cinematic shots; interactive previews for review."
  - "Product CGI — stills and animated visuals with fine detail and realism."
  - "Performance Ads — multi-format production (1:1, 9:16, 16:9), speed-to-creative, data-guided iteration."
  - "AI Character & Voice — photorealistic human characters with accurate lip-sync and speech-to-movement synchronization, using Kling, VEO 3, Seedance, and ComfyUI."
  - "Post — high-end image retouch (Photoshop + AI), video editing, sound tweaks."
how_i_work: "Clear brief → rapid prototypes → short iteration loops → controlled final delivery. Clean communication; organized versioning; backups and file hygiene. Open to art tests or proof-of-concepts."
mobility: "Open to opportunities in French- and German-speaking Switzerland; preference for international English-friendly environments."

