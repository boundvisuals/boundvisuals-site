claude-log:
  - text: "Sessão automática: no Painel → Vítor Hugo → Oportunidades há agora duas listas novas. 1) 'Onde procurar': 10 pesquisas já feitas que abrem num separador novo — LinkedIn (archviz em Portugal, 3D visualizer remoto na UE, ComfyUI/AI artist remoto, criativos de anúncios em Portugal), Chaos CG Connect Jobs, quadros só de vagas de IA, Behance Jobs e uma pesquisa de CLIENTES (empreendimentos em construção no Norte: os que têm renders fracos são os melhores contactos). Dica: nas pesquisas do LinkedIn carrega no sino 'Definir alerta' e recebes as vagas novas por email. 2) 'Pistas encontradas pelo Claude': 1 vaga para já — Gen AI Artist (ComfyUI) na Motus VFX, remoto para quem vive na Europa; o anúncio é de janeiro, por isso confirma se ainda está aberta. Se te interessar, carrega em '+ Adicionar às minhas' → Guardar e eu preparo a carta e as imagens certas na sessão seguinte."
    at: "2026-11-05T05:30:00+00:00"
  - text: "Sessão automática: 1) escrevi os briefings do Daily Study #028 a #033 (7 a 19 jan): #028 do clay ao final em 4 passos (mesma câmara, carrossel de processo); #029 'Clientes imaginários #1': casa de um surfista na Ericeira; #030 uma planta de 45 m² desenhada em 2 min → 3 imagens do interior (a planta é o 1.º slide); #031 a luz d'A Leiteira de Vermeer (domínio público) numa cozinha de hoje; #032 Casas de Portugal #4: Gerês, granito e nevoeiro; #033 desafio de cor #1: uma divisão toda em terracota, com voto dos seguidores para a cor seguinte. Cada um com modelo 3D, câmaras, luz, prompt AI em inglês e legenda EN/PT. 2) O Início do Painel agora avisa quando a fila repete o mesmo projeto em dias seguidos: a partir de 06/12 só há Apartamentos Gondomar 2 (até 7 dias seguidos, 10 a 16/12), porque os outros 3 projetos já esgotaram as imagens. Onde ver: https://www.boundvisuals.com/painel/ → Bound Visuals → Estúdio (briefings) e → Início (aviso), quando o robô acabar (~10 min). O que fazes: nada urgente; para eu voltar a alternar projetos em dezembro, envia os links MEGA dos projetos em falta (Tarefas → 'Enviar links MEGA')."
    at: "2026-11-05T04:32:00+00:00"
  - text: "Sessão automática: o Painel já manda NOTIFICAÇÕES para o telemóvel e o PC (grátis, sai do teu servidor, sem apps extra). Avisa-te: domingo às 19:00 com a semana a aprovar; na véspera às 19:00 de cada tarefa tua com data (ex.: hoje à noite 'Amanhã sex 10:00: apagar 8 plugins'); quando a fila tiver menos de 7 dias; às 20:00 um resumo do que eu fiz sozinho; e quando eu responder a uma Ideia. Nunca entre as 23:00 e as 08:00. Para ligar (em cada aparelho): 1) abre https://www.boundvisuals.com/painel/ ; 2) no Início aparece 'Queres os lembretes no telemóvel?' → carrega em 'Ligar notificações' → 'Permitir'; 3) para confirmar: Mais → Perfil → cartão 'Notificações neste aparelho' → 'Enviar teste' (chega em segundos). No iPhone tens de abrir o Painel pelo ícone do ecrã principal (Safari → Partilhar → 'Adicionar ao ecrã principal'). Corrigi também o cartão 'O que o Claude fez sozinho', que mostrava as mais antigas em vez das mais recentes."
    at: "2026-11-05T03:50:00+00:00"
  - text: "Sessão automática (pequena): o Início do Painel agora diz as coisas certas sobre a pausa do Instagram — em vez de 'volta a tentar às 11:35' (parecia hoje), mostra 'Pausa no Instagram: nada publica até sex 06/11 às 11:35' e qual é o próximo post aprovado (sex 06/11 às 19:00 · Vivendas Duas Igrejas). Em Redes, o Instagram aparece 'em pausa até 06/11 11:35' em vez de 'ligado'. Corrigi também o '1 dias' → '1 dia'. O que fazes: nada; vês em https://www.boundvisuals.com/painel/ → Início quando o robô acabar (~10 min)."
    at: "2026-11-05T02:40:00+00:00"
  - text: "Sessão automática: escrevi os briefings do Daily Study #022 a #027 (24 dez a 5 jan), pensados para as festas (pouca modelação): #022 desafio de 15 minutos com a lanterna do #019 numa janela (véspera de Natal, gravas o ecrã para o reel); #023 Antes e agora — escolhes um render teu antigo e refazes a mesma câmara com o processo de hoje; #024 do esboço de 2 minutos à imagem final; #025 a última imagem do ano, um terraço no Porto com fogo de artifício ao longe; #026 uma divisão em 4 estilos (suíço, japandi, brutalista, mediterrânico) com pergunta aos seguidores; #027 Casas de Portugal #3: Alentejo. Cada um com modelo, câmaras, luz, prompt AI em inglês e legenda EN/PT. Onde ver: Painel → Bound Visuals → Estúdio (https://www.boundvisuals.com/painel/), aparece quando o robô acabar (~10 min). O que fazes: nada agora; para o #023 vai pensando em qual render antigo queres refazer. Se quiseres trocar algum tema, escreve em Ideias."
    at: "2026-11-05T01:30:00+00:00"
  - text: "Sessão automática: fiz a página para LIGAR o Pinterest, o LinkedIn (perfil pessoal) e o YouTube Shorts. Onde: https://www.boundvisuals.com/painel/ → Vítor Hugo → Links → 'Ligar redes (Pinterest, LinkedIn, YouTube)' (aparece quando o robô do Painel acabar, ~10 min). Em cada rede: 1) abre 'Passo a passo (clique a clique)'; 2) crias a app na rede (o link está lá, com o nome e textos para colar); 3) colas o 'Endereço de retorno' (botão Copiar no topo); 4) copias o Client ID e o Client Secret para os campos → 'Guardar chaves' → 'Ligar' → aceitas. Deve aparecer 'Ligado ✓'. As chaves ficam só no teu servidor. Nada é publicado: depois de ligares, eu faço o robô e tudo continua a passar pela tua aprovação. Dica YouTube: não te esqueças do passo 'Publish app', senão a ligação morre ao fim de 7 dias."
    at: "2026-11-05T00:32:00+00:00"
  - text: "Sessão automática: fiz a versão em PORTUGUÊS do teu site pessoal. Inglês continua em https://www.boundvisuals.com/vitorhugo/ e o português fica em https://www.boundvisuals.com/vitorhugo/pt/ — no menu, ao lado de 'Contact', há um botão PT/EN para trocar. Traduzi tudo (apresentação, disciplinas, secções de IA, experiência, contactos); as recomendações do LinkedIn ficam no original, em inglês. O Google vai saber que são a mesma página em 2 línguas (continua 'noindex' até aprovares o site). O que fazes: nada obrigatório. Quando o robô acabar (~15 min) abre o link /pt/ no telemóvel e, se quiseres mudar alguma frase, diz-me qual (os textos estão em docs/vitorhugo-pt.yml)."
    at: "2026-11-04T23:32:00+00:00"
  - text: "Sessão automática: agora há stories TODOS os dias até 16 dez (antes acabavam a 27 nov). Nos dias com post e sem stories, o robô junta 2 stories: às 10:00 'Hoje · 19:00' com um pormenor do post do dia e às 20:30 'Novo no feed' com a 1.ª imagem — feitas só dos recortes que já revês no Calendário (se mudares um recorte, a story muda sozinha). Incluí também o dia 6 nov. Também pus um aviso no Início quando a fila de posts estiver a menos de 3 semanas do fim (hoje acaba a 16 dez). O que fazes: nada agora. Quando aprovares dias no Calendário (https://www.boundvisuals.com/painel/ → Bound Visuals → Calendário), estas stories aparecem lá como as outras, à espera do teu ✅. Não consegui abrir o danlemperle.com daqui; continua anotado."
