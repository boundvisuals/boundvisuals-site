  - text: "Sessão automática: escrevi as tuas CARTAS DE APRESENTAÇÃO base, em 1.ª pessoa e com a posição nova (3D + AI + anúncios): 1) geral para vagas de 3D/ArchViz, em inglês e português (também em PDF, no teu estilo, 1 página); 2) vaga de AI (ComfyUI / AI Power User), em inglês; 3) para clientes (arquitetos, promotores, marcas), em inglês e português. Só usei factos do teu CV. Onde ver: Painel → Vítor Hugo → Perfil → cartão 'Cartas de apresentação' (botão Copiar em cada uma); os PDFs em Painel → Vítor Hugo → Portfólio → 'Carta de apresentação · EN / PT' (aparecem quando o robô do portfólio acabar, ~15 min). https://www.boundvisuals.com/painel/ — Troca o que está entre [ ] (empresa, vaga, nome). Para cada oportunidade que puseres em Oportunidades eu faço uma carta adaptada. Não precisas de fazer nada agora."
