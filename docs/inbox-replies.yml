  - text: "Sessão automática: passei o teu ORÇAMENTO (orcamento_FINAL, 10 páginas) para a 1.ª pessoa ('modelo', 'entrego', 'não me responsabilizo' em vez de 'modelamos' / 'a Bound Visuals'). Preços, prazos e condições ficam iguais; nas cláusulas de contrato a parte continua a ser 'Bound Visuals'. Fiz também a versão completa em INGLÊS para clientes de fora. Encontrei 7 erros no PDF atual — o mais importante: na página 3 diz 'Validade da proposta 1, 2 e 3' mas é das propostas 4, 5 e 6; e na página 9 a data é '55 de janeiro de 2022'. Onde ver: Painel → Links → 'Orçamento na 1.ª pessoa (PT + EN)' (https://www.boundvisuals.com/painel/). O que fazes, quando quiseres: 1) abre orcamento_FINAL.indd no InDesign; 2) para cada bloco, apaga o texto ATUAL e cola o NOVO (a página está indicada); 3) Ficheiro → Exportar → PDF. Os teus dados (IBAN, cartão de cidadão) não estão no ficheiro de propósito."
