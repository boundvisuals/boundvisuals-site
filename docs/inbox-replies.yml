  - text: "Sessão automática: fiz o robô que monta reels com os TEUS vídeos (LTX, Seedance, Kling). Ordem = número no nome do ficheiro (01, 02, 03…); vídeos verticais enchem o ecrã, os horizontais aparecem inteiros sobre um fundo desfocado deles próprios (nunca corto a tua composição); título no 1.º vídeo, cartão final 'Vítor Hugo • Bound Visuals / boundvisuals.com', música gerada (sem problemas de direitos) ou o som dos teus vídeos. Testei com clips de teste: 1080×1920, 30 fps, alta qualidade. O que fazes quando tiveres animações: 1) no MEGA, dentro da pasta do projeto, cria uma pasta chamada video; 2) põe lá os vídeos com nomes 01, 02, 03…; 3) partilha a pasta do projeto (botão direito → Partilhar link → Copiar) e cola o link em Ideias com 'reel de vídeos'. Eu trato do resto. Nada é publicado sem a tua aprovação."
