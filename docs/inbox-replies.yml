  - text: "Anotado para o site novo (Vítor Hugo + Bound Visuals). Daqui não consigo abrir o danlemperle.com (bloqueado na minha rede); abro-o pelo browser do teu PC na próxima vez que estiver ligado e trago-te uma análise. Diz-me numa linha o que mais te agrada nele (o ar geral? a grelha? os vídeos? a navegação?)."
