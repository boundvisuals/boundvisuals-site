ai_sections:
  "Text to Image": ["Texto para imagem", "A base de cada projeto — geração pura a partir de texto. É aqui que as ideias ganham forma: arquitetura, produtos, pessoas e conceitos de publicidade. Cada imagem nasce de prompts físicos detalhados que simulam o comportamento real da câmara, a precisão dos materiais e as condições de luz."]
  "Image to Image": ["Imagem para imagem", "Reinterpretar e afinar imagens existentes — manter a geometria e melhorar luz, tom e atmosfera. Ideal para transformar renders ou imagens IA em peças prontas para campanha."]
  "Inpainting": ["Inpainting", "Edição precisa e com contexto — acrescentar, remover ou prolongar zonas da imagem sem perder realismo. É onde a IA encontra a direção de arte."]
  "Enhancement + Upscaling": ["Melhoria + Upscaling", "Transformar renders conceptuais de 1K em imagens de produção. Foco no refinamento do micro-detalhe e na exportação em alta resolução para impressão ou campanhas."]
  "ControlNET": ["ControlNet", "Guia estrutural com profundidade, mapas de arestas, canny, lineart e pose — manter a geometria e ganhar realismo. Usado aqui para mostrar composição e luz controladas."]
  "Workflows": ["Workflows", "Gravei uma visita guiada aos meus workflows — a melhor forma de perceber tudo de uma vez."]
