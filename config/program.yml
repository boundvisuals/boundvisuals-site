instagram:
  one_image_per_post: true
  feed_ratio: [4, 5]
  feed_size: [1080, 1350]
  story_size: [1080, 1920]
  non_4x5_policy: carousel     # 4:5 detail crops + whole image on white as last slide
  frame_color: "#111111"       # adjust to brand manual
  rotate_projects: true
  open_with_best_image: true
  per_day: {image_posts: 1, stories: [3, 5]}
  reels: {every_n_days: 2, one_per_project: true}
  queue_days_target: 14
  queue_days_warning: 7
  require_approval: true
  # MANDATORY on every Instagram post (Vítor, 2026-11-02)
  mentions:   # tagged on the image (user tags) AND in caption; IG max 20 tags → OK (14)
    - renderbox.magazine
    - cgtop
    - renderfiles
    - renderreactor
    - cgiaward
    - _cgconnect_official
    - topcgref
    - renderlovers
    - vwartclub
    - render_awards
    - thecgaward
    - architrendz
    - rendersbook
    - archilovers
  hashtags_max: 30   # Instagram hard limit; 38 given → 30 always + 8 rotate
  hashtags_always: [renderboxmagazine, cgtop, render_files, renderreactor, cgiaward, renderlovers, AllofRenders, render_community, topcgref, archviz, 3dartist, render, renderings, archvizstudio, architecturevisualization, rocvisual, renderinx, architrendz, coronarenderer, chaoscorona, tastyviz, rendersbook, render_awards, archilovers, renderbox, prorenders]
  hashtags_rotate: [homeinteriordaily, minimalmotifs, architecture_hunter, archiboom, Arc_Only, designcitylab, renderglobal, re_inspiration, rendering, cgi, allofarchitecture]   # 4 per post, cycling
web:
  lightbox: lossless_original   # pixel-identical, verified
  grid_widths: [800, 1600, 2400]
publish_order:
  first: [website, behance, cgarchitect, chaos_cgconnect, industriacriativa]
  then: [instagram, facebook, pinterest, linkedin, youtube]
