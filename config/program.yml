instagram:
  one_image_per_post: true
  feed_ratio: [4, 5]
  feed_size: [1080, 1350]
  story_size: [1080, 1920]
  non_4x5_policy: carousel     # 4:5 detail crops + whole image on white as last slide
  frame_color: "#111111"       # adjust to brand manual
  rotate_projects: true
  open_with_best_image: true
  per_day: {image_posts: 1, stories: [3, 5]}
  reels: {every_n_days: 2, one_per_project: true}
  queue_days_target: 14
  queue_days_warning: 7
  require_approval: true
  # MANDATORY on every Instagram post (Vítor, 2026-11-02)
  mentions:   # tagged on the image (user tags) AND in caption; IG max 20 tags → OK (14)
    - renderbox.magazine
    - cgtop
    - renderfiles
    - renderreactor
    - cgiaward
    - _cgconnect_official
    - topcgref
    - renderlovers
    - vwartclub
    - render_awards
    - thecgaward
    - architrendz
    - rendersbook
    - archilovers
  hashtags_in: caption   # Instagram allows max 5 hashtags per post since Dec 2025 → 5, at the end of the caption, no extra comment
  mentions_in_caption: true   # Vítor 04/11: the 14 mentions always go in the caption
  hashtags_max: 5
  hashtags_extra_comments: true   # the other 25 of the old 30 → comments of 5, posted one by one with a pause (Vítor 04/11)
  hashtags_comment_gap_s: 120
  hashtags_always: [archviz, architecturevisualization, 3dartist, coronarenderer]   # + 1 rotating = 5
  hashtags_old_30: [renderboxmagazine, cgtop, render_files, renderreactor, cgiaward, renderlovers, AllofRenders, render_community, topcgref, archviz, 3dartist, render, renderings, archvizstudio, architecturevisualization, rocvisual, renderinx, architrendz, coronarenderer, chaoscorona, tastyviz, rendersbook, render_awards, archilovers, renderbox, prorenders]
  hashtags_rotate: [homeinteriordaily, minimalmotifs, architecture_hunter, archiboom, Arc_Only, designcitylab, renderglobal, re_inspiration, rendering, cgi, allofarchitecture]   # 1 per post, cycling
web:
  lightbox: lossless_original   # pixel-identical, verified
  grid_widths: [800, 1600, 2400]
publish_order:
  first: [website, behance, cgarchitect, chaos_cgconnect, industriacriativa]
  then: [instagram, facebook, pinterest, linkedin, youtube]
meta:
  page_id: "102995032197827"        # Facebook Page: Bound Visuals
  ig_user_id: "17841450386900546"    # Instagram: @vitorhugo_boundvisuals
  token_secret: META_TOKEN            # System User bv-robot, never expires
